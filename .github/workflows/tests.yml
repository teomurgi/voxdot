name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Headless tests
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - uses: actions/checkout@v4

      # The image ships Godot 4.7.2; the project data has to be imported once
      # so that class_name scripts are registered.
      - name: Import the project
        run: godot --headless --path . --import

      # Each suite exits non-zero when a check fails.
      - name: VoxelDocument
        run: godot --headless --path . -s tests/voxel_document_test.gd

      - name: VoxelModelEditor
        run: godot --headless --path . -s tests/voxel_editor_test.gd

      - name: Editor input handling
        run: godot --headless --path . -s tests/voxel_editor_input_test.gd
